name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The pom carries a -SNAPSHOT version between releases. The tag is the
      # single source of truth for what a release is called, so derive it from
      # there rather than relying on someone remembering to bump the pom.
      - name: Set the version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Releasing $VERSION from tag $GITHUB_REF_NAME"
          ./mvnw -B versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Build the runnable jar
        run: ./mvnw -B package

      - name: Attach the jar to the release
        uses: softprops/action-gh-release@v2
        with:
          files: target/HumanSimulation.jar
          generate_release_notes: true
