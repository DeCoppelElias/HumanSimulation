name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The pom stays on -SNAPSHOT; the tag is the source of truth.
      - name: Set the version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Releasing $VERSION from tag $GITHUB_REF_NAME"
          ./mvnw -B versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Build the runnable jar
        run: ./mvnw -B package

      - name: Attach the jar to the release
        uses: softprops/action-gh-release@v3
        with:
          files: target/HumanSimulation.jar
          generate_release_notes: true
