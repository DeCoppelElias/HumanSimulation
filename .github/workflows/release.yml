name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build the runnable jar
        run: ./mvnw -B package

      - name: Attach the jar to the release
        uses: softprops/action-gh-release@v2
        with:
          files: target/HumanSimulation.jar
          generate_release_notes: true
