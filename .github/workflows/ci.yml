name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Windows is where the app actually runs, so it is checked too.
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          # Spotless ratchetFrom resolves a git ref and fails on a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Check the docs agree with each other
        shell: bash
        run: python tools/docs-check.py && python tools/test_docs_check.py

      - name: Build, check formatting and run tests
        # bash on both runners, so ./mvnw is the same command everywhere.
        shell: bash
        run: ./mvnw -B verify
