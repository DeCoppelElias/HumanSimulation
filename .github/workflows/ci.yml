name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Windows is where the app is actually developed and run, so the
        # resource-loading and path behaviour gets checked there too.
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Spotless ratchetFrom resolves a git ref and fails on a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, check formatting and run tests
        # bash on both runners, so ./mvnw is the same command everywhere.
        shell: bash
        run: ./mvnw -B verify
